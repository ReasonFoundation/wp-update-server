---
name: Tests

"on":
  push:
    branches: [master]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Run test scripts
        run: |
          status=0
          for t in tests/*-test.php; do
            echo "== $t"
            php "$t" || status=1
          done
          exit $status
