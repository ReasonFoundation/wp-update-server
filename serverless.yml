service: wp-update-server

bref:
  team: reason

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - !GetAtt WPUpdateBucket.Arn
            - !Sub '${WPUpdateBucket.Arn}/*'

functions:
  web:
    # `index.php` is the entrypoint of your application
    handler: index.php
    runtime: php-84-fpm
    timeout: 28 # in seconds (API Gateway has a max timeout of 29 seconds)
    environment:
      S3_BUCKET: !Ref WPUpdateBucket
      S3_PREFIX: ${env:S3_PREFIX, 'packages/'}
      # Shared secret that gates the `get_metadata` and `download` actions. Leave empty/unset to disable the gate.
      # Create/rotate per stage with the Bref CLI:
      #   vendor/bin/bref secret:create --name SIMPLE_UPDATE_KEY --value '<random-string>' --stage prod
      # This stores a SecureString at /${self:service}/${stage}/SIMPLE_UPDATE_KEY in SSM Parameter Store.
      SIMPLE_UPDATE_KEY: ${ssm:/${self:service}/${self:provider.stage}/SIMPLE_UPDATE_KEY, ''}
    events:
      - httpApi: '*'

resources:
  Resources:
    WPUpdateBucket:
      Type: AWS::S3::Bucket
      Properties:
        # Fully private. Nothing reads the bucket directly except the Lambda (via its IAM
        # role above) and clients holding a presigned URL the Lambda handed them after
        # checking SIMPLE_UPDATE_KEY.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true

plugins:
  - ./vendor/bref/bref