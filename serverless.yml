service: wp-update-server

bref:
  team: reason

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - !GetAtt WPUpdateBucket.Arn
            - !Sub '${WPUpdateBucket.Arn}/*'

package:
  patterns:
    - '!tests/**'
    - '!docs/**'
    - '!.github/**'
    - '!.idea/**'
    - '!.superpowers/**'
    - '!.junie/**'
    - '!test-s3-logic.php'

functions:
  web:
    # `index.php` is the entrypoint of your application
    handler: index.php
    runtime: php-84-fpm
    timeout: 28 # in seconds (API Gateway has a max timeout of 29 seconds)
    environment:
      S3_BUCKET: !Ref WPUpdateBucket
      S3_PREFIX: ${env:S3_PREFIX, 'packages/'}
      # Shared secret that gates both the update-checker route (`get_metadata`/`download`)
      # and the Composer routes (`/packages.json`, `/p2/...`, `/dist/...`). When empty or
      # unset, the update-checker route is ungated, but the Composer routes return 503
      # (they fail closed). Read at deploy time from SSM Parameter Store at
      # /${self:service}/<stage>/SIMPLE_UPDATE_KEY. Set/rotate it with:
      #   aws ssm put-parameter --region us-east-1 --name /wp-update-server/<stage>/SIMPLE_UPDATE_KEY --type SecureString --value '<key>'
      SIMPLE_UPDATE_KEY: ${ssm:/${self:service}/${self:provider.stage}/SIMPLE_UPDATE_KEY, ''}
    events:
      - httpApi: '*'

resources:
  Resources:
    WPUpdateBucket:
      Type: AWS::S3::Bucket
      Properties:
        # Fully private. Nothing reads the bucket directly except the Lambda (via its IAM
        # role above) and clients holding a presigned URL the Lambda handed them after
        # checking SIMPLE_UPDATE_KEY.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true

plugins:
  - ./vendor/bref/bref